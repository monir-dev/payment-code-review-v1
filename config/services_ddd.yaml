# DDD Infrastructure Services Configuration
services:
    # Entity Mappers
    App\Infrastructure\Persistence\PaymentEntityMapper:
        arguments: []

    App\Infrastructure\Persistence\PlanEntityMapper:
        arguments: []

    App\Infrastructure\Persistence\CustomerEntityMapper:
        # CustomerEntityMapper has no dependencies

    App\Infrastructure\Persistence\SubscriptionEntityMapper:
        arguments:
            - '@App\Infrastructure\Persistence\PlanEntityMapper'
            - '@App\Infrastructure\Persistence\CustomerEntityMapper'
            - '@doctrine.orm.entity_manager'

    # Domain Repositories (Infrastructure Implementation)
    App\Domain\Payment\Repository\PaymentRepositoryInterface:
        class: App\Infrastructure\Repository\PaymentRepository
        arguments:
            - '@doctrine'
            - '@App\Infrastructure\Persistence\PaymentEntityMapper'
            - '@App\Infrastructure\Event\DomainEventPublisher'

    App\Domain\Billing\Repository\PlanRepositoryInterface:
        class: App\Infrastructure\Repository\PlanRepository
        arguments:
            - '@doctrine'
            - '@App\Infrastructure\Persistence\PlanEntityMapper'
            - '@App\Infrastructure\Event\DomainEventPublisher'

    App\Domain\Subscription\Repository\SubscriptionRepositoryInterface:
        class: App\Infrastructure\Repository\SubscriptionRepository
        arguments:
            - '@doctrine'
            - '@App\Infrastructure\Persistence\SubscriptionEntityMapper'
            - '@App\Infrastructure\Event\DomainEventPublisher'

    # Application Services
    App\Application\Service\PaymentGatewayInterface:
        class: App\Infrastructure\Gateway\NmiPaymentGatewayAdapter
        arguments:
            - '@App\Service\NmiPaymentGateway'  # Existing NMI service
            - '@logger'

    # Command Handlers
    App\Application\Handler\ProcessPaymentCommandHandler:
        arguments:
            - '@App\Domain\Payment\Repository\PaymentRepositoryInterface'
            - '@App\Application\Service\PaymentGatewayInterface'
        tags: ['app.command_handler']

    App\Application\Handler\CreateSubscriptionCommandHandler:
        arguments:
            - '@App\Domain\Subscription\Repository\SubscriptionRepositoryInterface'
            - '@App\Domain\Billing\Repository\PlanRepositoryInterface'
        tags: ['app.command_handler']

    App\Application\Handler\CreatePlanCommandHandler:
        arguments:
            - '@App\Domain\Billing\Repository\PlanRepositoryInterface'
            - '@App\Application\Service\PaymentGatewayInterface'
        tags: ['app.command_handler']

    App\Application\Handler\TogglePlanStatusCommandHandler:
        arguments:
            - '@App\Domain\Billing\Repository\PlanRepositoryInterface'
            - '@logger'
        tags: ['app.command_handler']

    App\Application\Handler\InitializePaymentCommandHandler:
        arguments:
            - '@App\Application\Service\PaymentGatewayInterface'
            - '@logger'
        tags: ['app.command_handler']

    App\Application\Handler\CompletePaymentCommandHandler:
        arguments:
            - '@App\Service\NmiPaymentGateway'
            - '@App\Infrastructure\Event\DomainEventBus'
            - '@App\Infrastructure\Event\EventListenerRegistry'
            - '@logger'
        tags: ['app.command_handler']

    App\Application\Handler\ProcessRefundCommandHandler:
        arguments:
            - '@App\Application\Service\PaymentGatewayInterface'
            - '@App\Infrastructure\Event\DomainEventBus'
            - '@App\Domain\Subscription\Repository\SubscriptionRepositoryInterface'
            - '@App\Application\Handler\CancelSubscriptionCommandHandler'
            - '@App\Repository\PaymentTransactionRepository'
            - '@App\Domain\Payment\Service\RefundProcessingService'
            - '@logger'
        tags: ['app.command_handler']

    # Application Services
    App\Application\Service\PaymentSessionService:
        arguments:
            - '@request_stack'
        tags: ['app.application_service']

    App\Application\Service\TransactionLinkingService:
        arguments:
            - '@App\Repository\PaymentTransactionRepository'
            - '@logger'
        tags: ['app.application_service']

    # Domain Services
    App\Domain\Payment\Service\RefundProcessingService:
        tags: ['app.domain_service']

    # Query Handlers
    App\Application\Handler\GetActivePlansQueryHandler:
        arguments:
            - '@App\Domain\Billing\Repository\PlanRepositoryInterface'
        tags: ['app.query_handler']

    App\Application\Handler\GetTransactionHistoryQueryHandler:
        arguments:
            - '@App\Repository\PaymentTransactionRepository'
            - '@logger'
        tags: ['app.query_handler']

    App\Application\Handler\GetDashboardStatsQueryHandler:
        arguments:
            - '@App\Domain\Subscription\Repository\SubscriptionRepositoryInterface'
            - '@App\Repository\PaymentTransactionRepository'
            - '@logger'
        tags: ['app.query_handler']

    App\Application\Handler\GetSubscriptionsByCustomerEmailQueryHandler:
        arguments:
            - '@App\Domain\Subscription\Repository\SubscriptionRepositoryInterface'
        tags: ['app.query_handler']

    App\Application\Handler\GetPaymentByTransactionIdQueryHandler:
        arguments:
            - '@App\Domain\Payment\Repository\PaymentRepositoryInterface'
        tags: ['app.query_handler']

    # Event Bus and Listeners
    App\Infrastructure\Event\DomainEventBus:
        arguments:
            - '@logger'

    App\Infrastructure\Event\DomainEventPublisher:
        arguments:
            - '@App\Infrastructure\Event\DomainEventBus'

    App\Infrastructure\Event\PaymentEventListener:
        arguments:
            - '@logger'
        tags: ['app.event_listener']

    App\Infrastructure\Event\SubscriptionEventListener:
        arguments:
            - '@logger'
        tags: ['app.event_listener']

    App\Infrastructure\Event\PlanEventListener:
        arguments:
            - '@logger'
        tags: ['app.event_listener']

    App\Infrastructure\Event\PaymentCompletedEventListener:
        arguments:
            - '@App\Application\Handler\CreateSubscriptionCommandHandler'
            - '@App\Application\Service\TransactionLinkingService'
            - '@logger'
        tags: ['app.event_listener']
        lazy: true

    App\Infrastructure\Event\TransactionCompletedEventHandler:
        arguments:
            - '@App\Repository\PaymentTransactionRepository'
            - '@logger'
        tags: ['app.event_listener']

    App\Infrastructure\Event\RebillTransactionCompletedEventHandler:
        arguments:
            - '@App\Repository\PaymentTransactionRepository'
            - '@logger'
        tags: ['app.event_listener']


    App\Infrastructure\Event\EventListenerRegistry:
        arguments:
            - '@App\Infrastructure\Event\DomainEventBus'
            - '@App\Infrastructure\Event\PaymentEventListener'
            - '@App\Infrastructure\Event\SubscriptionEventListener'
            - '@App\Infrastructure\Event\PlanEventListener'
            - '@App\Infrastructure\Event\TransactionCompletedEventHandler'
            - '@App\Infrastructure\Event\RebillTransactionCompletedEventHandler'
            - '@App\Infrastructure\Event\PaymentCompletedEventListener'
        lazy: false  # Force eager loading to ensure listeners are registered

    # Controllers (Presentation Layer)
    App\Presentation\Controller\PaymentController:
        arguments:
            - '@App\Application\Handler\CancelSubscriptionCommandHandler'
            - '@App\Application\Handler\InitializePaymentCommandHandler'
            - '@App\Application\Handler\CompletePaymentCommandHandler'
            - '@App\Application\Handler\ProcessRefundCommandHandler'
            - '@App\Application\Handler\GetTransactionHistoryQueryHandler'
            - '@App\Application\Service\PaymentSessionService'
            - '@logger'
            - '@App\Infrastructure\Repository\PlanRepository'
            - '@App\Domain\Subscription\Repository\SubscriptionRepositoryInterface'
        tags: ['controller.service_arguments']

    App\Presentation\Controller\SubscriptionController:
        arguments:
            - '@App\Application\Handler\CreateSubscriptionCommandHandler'
            - '@App\Domain\Subscription\Repository\SubscriptionRepositoryInterface'
            - '@App\Domain\Billing\Repository\PlanRepositoryInterface'
            - '@logger'
        tags: ['controller.service_arguments']

    App\Presentation\Controller\PlanController:
        arguments:
            - '@App\Application\Handler\CreatePlanCommandHandler'
            - '@App\Application\Handler\TogglePlanStatusCommandHandler'
            - '@App\Domain\Billing\Repository\PlanRepositoryInterface'
            - '@logger'
        tags: ['controller.service_arguments']
